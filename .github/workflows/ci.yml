name: CI

# Pull requests and `main` are built and tested. Railway deploys only `main`, and only after this
# workflow has passed on the commit ("Wait for CI"), see docs/HOSTING.md. Branch pushes are not
# built twice: their pull request runs the same jobs (Actions minutes are limited on a private repo).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same major as production (Railway postgres-ssl:18). The runner's pg_dump (Ubuntu 26.04) writes
        # "SET transaction_timeout", which a 16 server rejects on restore (BackupTests).
        image: postgres:18
        env:
          POSTGRES_USER: lugat
          POSTGRES_PASSWORD: lugat
          POSTGRES_DB: lugat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lugat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUGAT_TEST_POSTGRES: Host=localhost;Username=lugat;Password=lugat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: node --test tests/web/*.test.mjs
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project src/Lugat.Infrastructure
      - run: dotnet test --no-build -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: npx --prefix tests/browser playwright test --config tests/browser/playwright.config.mjs
      - name: Restore sample backup into a fresh database
        env:
          PGHOST: localhost
          PGUSER: lugat
          PGPASSWORD: lugat
        run: |
          pg_dump --format=custom --no-owner --no-privileges --file "$RUNNER_TEMP/lugat-browser.dump" lugat_browser
          bash scripts/rehearse-restore.sh "$RUNNER_TEMP/lugat-browser.dump" lugat_rehearsal_ci
      - name: Verify the restored application in Chromium
        env:
          LUGAT_BROWSER_POSTGRES: Host=localhost;Database=lugat_rehearsal_ci;Username=lugat;Password=lugat
          Catalog__SeedSample: 'false'
        run: npx --prefix tests/browser playwright test --config tests/browser/playwright.config.mjs --project phone-light
      - name: Run the learning flow against the restored database
        env:
          LUGAT_BROWSER_POSTGRES: Host=localhost;Database=lugat_rehearsal_ci;Username=lugat;Password=lugat
          Catalog__SeedSample: 'false'
        run: npx --prefix tests/browser playwright test --config tests/browser/playwright.config.mjs --project phone-light
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: tests/browser/test-results

  # Railway builds this Dockerfile; building it here first means a broken image never reaches "Wait for CI".
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lugat:ci .
      - run: docker run --rm --entrypoint pg_dump lugat:ci --version
      - name: Runtime drops root after preparing the volume
        run: |
          lugat_runtime_uid=$(docker run --rm --user 0 lugat:ci id -u)
          test "$lugat_runtime_uid" = "1654"
